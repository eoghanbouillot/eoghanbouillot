<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">EOGHAN BOUILLOT — Web Penetration Testing, Offensive Security, CTF</title>
<desc id="desc">Offensive security themed GitHub header featuring a stylized command line, neon grid, and verified spYCTF achievements.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080d1a"/>
    <stop offset="0.53" stop-color="#0d1930"/>
    <stop offset="1" stop-color="#11112d"/>
  </linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3df5d2"/>
    <stop offset="0.55" stop-color="#42a9ff"/>
    <stop offset="1" stop-color="#b36dff"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f8ffff"/>
    <stop offset="0.48" stop-color="#d4fff8"/>
    <stop offset="1" stop-color="#77dafe"/>
  </linearGradient>
  <radialGradient id="radial">
    <stop offset="0" stop-color="#296bee" stop-opacity="0.34"/>
    <stop offset="1" stop-color="#296bee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#88d7ff" stroke-opacity="0.075" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="rounded"><rect width="1200" height="360" rx="22"/></clipPath>
  <style>
    .mono{font-family:Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
    .sans{font-family:Inter,'DejaVu Sans',Arial,sans-serif}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    .cursor{animation:blink 1s steps(2,start) infinite}
    .orbit{animation:orbit 17s linear infinite;transform-origin:1020px 180px}
    @keyframes pulse{50%{opacity:.24}}
    @keyframes blink{to{opacity:0}}
    @keyframes orbit{to{transform:rotate(360deg)}}
  </style>
</defs>
<g clip-path="url(#rounded)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="180" cy="90" r="270" fill="url(#radial)"/>
  <circle cx="1060" cy="220" r="340" fill="url(#radial)" opacity="0.8"/>
  <path d="M0 2 H1200" stroke="url(#stroke)" stroke-width="4"/>
  <path d="M0 358 H1200" stroke="url(#stroke)" stroke-width="3"/>
  <path d="M645 0V360" stroke="url(#stroke)" stroke-opacity=".11"/>
  <!-- Cyber visual accent -->
  <g opacity=".24" class="orbit" fill="none" stroke="#7adffb">
    <circle cx="1020" cy="180" r="170" stroke-dasharray="10 18"/>
    <circle cx="1020" cy="180" r="142" stroke-opacity=".42" stroke-dasharray="3 12"/>
  </g>
  <g fill="#4fe6da" opacity=".66">
    <circle cx="73" cy="52" r="2.5"/><circle cx="105" cy="52" r="2.5"/><circle cx="137" cy="52" r="2.5"/>
  </g>
  <rect x="67" y="82" width="340" height="29" rx="14.5" fill="#103d45" stroke="#40dcca" stroke-opacity=".5"/>
  <circle cx="82" cy="96.5" r="4" fill="#5cffc1" filter="url(#glow)" class="pulse"/>
  <text class="mono" x="98" y="101" font-size="11" font-weight="700" letter-spacing="1.2" fill="#99fff1">OFFENSIVE SECURITY / WEB PENTEST</text>

  <text class="sans" x="65" y="191" font-size="83" font-weight="900" letter-spacing="-3" fill="url(#name)">EOGHAN</text>
  <text class="sans" x="68" y="230" font-size="34" font-weight="800" letter-spacing="8" fill="#8dc7ee">BOUILLOT</text>
  <path d="M67 245 H594" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <text class="mono" x="68" y="272" font-size="16" fill="#d9edff">Web Pentest</text>
  <text class="mono" x="195" y="272" font-size="16" fill="#657f9f">//</text>
  <text class="mono" x="230" y="272" font-size="16" fill="#d9edff">Red Team</text>
  <text class="mono" x="335" y="272" font-size="16" fill="#657f9f">//</text>
  <text class="mono" x="372" y="272" font-size="16" fill="#d9edff">CTF Player</text>
  <text class="mono" x="69" y="310" font-size="12" letter-spacing="2" fill="#6b95b2">RECON  ·  ENUMERATE  ·  EXPLOIT  ·  DOCUMENT</text>

  <!-- Terminal window -->
  <rect x="696" y="67" width="448" height="248" rx="16" fill="#070f1d" fill-opacity=".93" stroke="#5acfee" stroke-opacity=".52" stroke-width="1.5"/>
  <rect x="697" y="68" width="446" height="38" rx="15" fill="#15253b"/>
  <path d="M697 106H1143" stroke="#32506d" stroke-width="1"/>
  <circle cx="721" cy="87" r="5" fill="#ff6f76"/>
  <circle cx="740" cy="87" r="5" fill="#ffbd59"/>
  <circle cx="759" cy="87" r="5" fill="#49dda1"/>
  <text x="917" y="92" class="mono" font-size="13" fill="#8faccd" text-anchor="middle">eoghan@kali: ~</text>
  <text x="723" y="143" class="mono" font-size="15" fill="#5ef7c7">$ <tspan fill="#d6edff">whoami</tspan></text>
  <text x="723" y="168" class="mono" font-size="14" fill="#97b3d6">web_pentest | offensive_security</text>
  <text x="723" y="202" class="mono" font-size="15" fill="#5ef7c7">$ <tspan fill="#d6edff">cat achievements.txt</tspan></text>
  <text x="723" y="227" class="mono" font-size="14" fill="#97b3d6">spYCTF  //  #2 France (2026)</text>
  <text x="723" y="247" class="mono" font-size="14" fill="#97b3d6">BYUCTF 2026  //  #1 of 509</text>
  <text x="723" y="282" class="mono" font-size="15" fill="#5ef7c7">$ <tspan class="cursor" fill="#a5fff1">▋</tspan></text>
  <path d="M1143 145l25-14m-25 64l31 16m-31 66l24 21" fill="none" stroke="#4dbbdc" stroke-opacity=".38"/>
  <g fill="#67f5de"><circle cx="1168" cy="131" r="3"/><circle cx="1174" cy="211" r="3"/><circle cx="1167" cy="298" r="3"/></g>
</g>
</svg>
